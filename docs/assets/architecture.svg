<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="340" viewBox="0 0 1400 340" role="img" aria-labelledby="title desc"><title id="title">Morse audio transcription pipeline</title><desc id="desc">Waveform to mel features to CNN to five-layer BiLSTM to CTC text decoding.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#73dec9" stroke-width="1.5"/></marker></defs><rect width="1400" height="340" rx="20" fill="#101c30"/><g font-family="Arial, sans-serif"><text x="35" y="46" fill="#73dec9" font-size="17">AUDIO TO TEXT</text><text x="35" y="85" fill="white" font-size="28" font-weight="bold">Learn the signal patterns. Align them with characters.</text><rect x="35" y="120" width="242" height="140" rx="12" fill="#20374d" stroke="#37556d"/><text x="53" y="157" fill="white" font-size="22" font-weight="bold">Waveform</text><text x="53" y="194" dy="0" fill="#bcd0e2" font-size="17">Mono audio</text><text x="53" y="194" dy="27" fill="#bcd0e2" font-size="17">22,050 Hz</text><path d="M279 190 h22" stroke="#73dec9" stroke-width="2" marker-end="url(#a)"/><rect x="307" y="120" width="242" height="140" rx="12" fill="#20374d" stroke="#37556d"/><text x="325" y="157" fill="white" font-size="22" font-weight="bold">Mel frontend</text><text x="325" y="194" dy="0" fill="#bcd0e2" font-size="17">64 frequency bands</text><text x="325" y="194" dy="27" fill="#bcd0e2" font-size="17">FFT 1,024 · hop 256</text><path d="M551 190 h22" stroke="#73dec9" stroke-width="2" marker-end="url(#a)"/><rect x="579" y="120" width="242" height="140" rx="12" fill="#20374d" stroke="#37556d"/><text x="597" y="157" fill="white" font-size="22" font-weight="bold">CNN encoder</text><text x="597" y="194" dy="0" fill="#bcd0e2" font-size="17">8 → 16 → 64 channels</text><text x="597" y="194" dy="27" fill="#bcd0e2" font-size="17">640 → 256 projection</text><path d="M823 190 h22" stroke="#73dec9" stroke-width="2" marker-end="url(#a)"/><rect x="851" y="120" width="242" height="140" rx="12" fill="#20374d" stroke="#37556d"/><text x="869" y="157" fill="white" font-size="22" font-weight="bold">BiLSTM</text><text x="869" y="194" dy="0" fill="#bcd0e2" font-size="17">5 bidirectional layers</text><text x="869" y="194" dy="27" fill="#bcd0e2" font-size="17">256 units / direction</text><path d="M1095 190 h22" stroke="#73dec9" stroke-width="2" marker-end="url(#a)"/><rect x="1123" y="120" width="242" height="140" rx="12" fill="#20374d" stroke="#37556d"/><text x="1141" y="157" fill="white" font-size="22" font-weight="bold">CTC decoding</text><text x="1141" y="194" dy="0" fill="#bcd0e2" font-size="17">45 classes incl. blank</text><text x="1141" y="194" dy="27" fill="#bcd0e2" font-size="17">Collapse → transcript</text><text x="35" y="306" fill="#bcd0e2" font-size="18">Training: time/frequency masks + CTC loss     Evaluation: character error rate + exact match</text></g></svg>