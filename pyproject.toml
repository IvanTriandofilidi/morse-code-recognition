[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morse-code-asr"
version = "0.1.0"
description = "CNN-BiLSTM-CTC transcription of Morse audio"
requires-python = ">=3.11"
dependencies = ["torch>=2.2,<3", "librosa>=0.10,<0.12", "numpy>=1.26,<3", "soundfile>=0.12,<0.14", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "build>=1"]
notebooks = ["ipykernel>=6", "nbclient>=0.10", "nbformat>=5"]

[project.scripts]
morse-asr = "morse_asr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
