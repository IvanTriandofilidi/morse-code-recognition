name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest -q
      - run: python -m morse_asr.demo --output runs/demo
      - run: morse-asr train --manifest runs/demo/manifest.csv --output runs/smoke --epochs 1 --batch-size 3 --hidden-size 8 --layers 1
      - run: morse-asr evaluate --manifest runs/demo/manifest.csv --checkpoint runs/smoke/best.pt --output runs/predictions.csv
